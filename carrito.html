<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🛒 Carrito</title>
  <link rel="icon" type="image/svg+xml" href="src/img/logo_gamer.svg">
  <link rel="stylesheet" href="src/css/carrito.css">
  <link rel="stylesheet" href="src/css/style.css">
  <script src="https://kit.fontawesome.com/a2d9d5d6b2.js" crossorigin="anonymous"></script>
</head>
<body>
  
<header class="main-header">

  <!-- Logo -->
  <div class="logo">🎮 GAMING STORE</div>

  <!-- NAV GENERAL -->
  <nav>
    <a href="index.html"><strong>INICIO</strong></a>
    <a href="index.html#productos"><strong>PRODUCTOS DESTACADOS</strong></a>
    <a href="ver_mas.html"><strong>MAS</strong></a> 
    <a href="index.html#pie"><strong>CONTACTO</strong></a>
  </nav>

  <!-- ICONOS DERECHA -->
  <div class="header-icons">

    <!-- BOTONES LOGIN / REGISTER -->
    <div class="user-actions" id="authButtons">
      <a href="login.html" id="loginBtn" class="btn-login">Iniciar sesión</a>
      <a href="signup.html" id="registerBtn" class="btn-register">Registrarse</a>
    </div>

    <!-- ICONO DE USUARIO (cuando hay sesión) -->
    <div id="userIcon" class="user-icon" style="display:none;">
      <img src="src/img/usuario.png" alt="Usuario" id="userMenuBtn" title="Menú de usuario">

      <!-- MENÚ DESPLEGABLE -->
      <div id="userMenu" class="user-menu" style="display:none;">
        <p id="userName">👤 Usuario</p>
        <a href="#" id="configuracionBtn">⚙️ Configuración</a>
        <a href="mis_compras.html" id="comprasBtn">🛒 Mis compras</a>
        <a href="favoritos.html" id="favoritosBtn">⭐ Favoritos</a>
        <hr>
        <a href="#" id="logoutBtn">🚪 Cerrar sesión</a>
      </div>
    </div>

    <!-- CARRITO -->
    <a href="carrito.html">
      <button class="btn-icon cart-icon">🛒</button>
    </a>

  </div>
</header>


<!-- MODAL CONFIGURACIÓN -->
<div id="configModal" class="modal">
  <div class="modal-content">
    <h2>⚙️ Configuración de cuenta</h2>

    <div class="config-info">
      <p><strong>Nombre:</strong> <span id="confName"></span></p>
      <p><strong>Email:</strong> <span id="confEmail"></span></p>
      <p><strong>Estado:</strong> <span id="confStatus">Activo ✅</span></p>
    </div>

    <hr>

    <div class="config-actions">
      <button id="changePasswordBtn">🔒 Cambiar contraseña</button>
      <button id="closeConfigBtn">Cerrar</button>
    </div>
  </div>
</div>


<!-- MODAL CAMBIAR CONTRASEÑA (INDEPENDIENTE) -->
<div id="passwordModal" class="modal">
  <div class="modal-content password-box">
    <h2>🔒 Cambiar contraseña</h2>

    <label>Contraseña actual</label>
    <input type="password" id="oldPass">

    <label>Nueva contraseña</label>
    <input type="password" id="newPass">

    <label>Repetir nueva contraseña</label>
    <input type="password" id="repeatNewPass">

    <div class="config-actions">
      <button id="savePassBtn">Guardar</button>
      <button id="closePassBtn">Cancelar</button>
    </div>

  </div>
</div>

    
    
  
    <section class="carrito">
        <a href="index.html" class="btn-volver">⬅ Volver al inicio</a>
    <h2><i class="fas fa-shopping-cart"></i> 🛒 CARRITO</h2>
    <div id="carrito-contenedor"></div>

    <div class="carrito-total">
      <p>Total: <span id="total">$0.00</span></p>
      <button class="btn-finalizar">FINALIZAR COMPRA</button>
    </div>
  </section>
  

  <script src="src/js/carrito.js"></script>
  <script src="src/js/auth.js"></script>
</body>
</html>
